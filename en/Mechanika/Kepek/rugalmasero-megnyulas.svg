<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <!-- White background -->
  <rect width="100%" height="100%" fill="white" />
  
  <!-- Title -->
  <text x="300" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Stretching Force vs. Elongation</text>

  <!-- Definition of arrowheads for axes -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>

  <!-- Triangle area (Work done / Elastic potential energy) -->
  <polygon points="100,320 450,320 450,80" fill="#87CEEB" fill-opacity="0.5" />

  <!-- Guidelines (dashed) to the axes -->
  <g stroke="#888" stroke-width="1.5" stroke-dasharray="6,4">
    <!-- Horizontal guideline to kx -->
    <line x1="100" y1="80" x2="450" y2="80" />
    <!-- Vertical guideline to x -->
    <line x1="450" y1="320" x2="450" y2="80" />
  </g>

  <!-- Axes -->
  <g stroke="#333" stroke-width="2">
    <!-- X-axis (Elongation) -->
    <line x1="80" y1="320" x2="550" y2="320" marker-end="url(#arrow)" />
    <!-- Y-axis (Force) -->
    <line x1="100" y1="340" x2="100" y2="50" marker-end="url(#arrow)" />
  </g>

  <!-- Force line (F = k * x function) -->
  <line x1="100" y1="320" x2="450" y2="80" stroke="#D32F2F" stroke-width="3" stroke-linecap="round" />
  
  <!-- Endpoints with dots -->
  <circle cx="100" cy="320" r="4" fill="#D32F2F" />
  <circle cx="450" cy="80" r="4" fill="#D32F2F" />

  <!-- Ticks on axes -->
  <g stroke="#333" stroke-width="2">
    <!-- X-axis tick -->
    <line x1="450" y1="315" x2="450" y2="325" />
    <!-- Y-axis tick -->
    <line x1="95" y1="80" x2="105" y2="80" />
  </g>

  <!-- Axis labels and indicators -->
  <g font-family="Arial, sans-serif" font-size="16" fill="#333">
    <!-- Origin -->
    <text x="85" y="340" text-anchor="end">0</text>
    
    <!-- X-axis (Displacement) -->
    <text x="450" y="345" text-anchor="middle" font-style="italic" font-weight="bold">x</text>
    <text x="570" y="345" text-anchor="end" font-weight="bold">Displacement</text>

    <!-- Y-axis (Force) -->
    <text x="85" y="85" text-anchor="end" font-style="italic" font-weight="bold">kx</text>
    <text x="90" y="40" text-anchor="end" font-weight="bold">Force (F)</text>
  </g>

  <!-- Area explanation text inside the triangle -->
  <text x="330" y="230" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#005b96" text-anchor="middle">Work Done (W)</text>
  <text x="330" y="255" font-family="Arial, sans-serif" font-size="14" fill="#005b96" text-anchor="middle">Area = area of triangle</text>
  
  <!-- Formula inside the triangle -->
  <g font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#005b96" text-anchor="middle">
    <text x="330" y="285">W = ½ · x · kx = ½kx²</text>
  </g>
</svg>
